      category: behavior
      finding: 'internal/service/service.go:132 — Install writes the desired unit before applying it, then treats byte equality as proof it was applied. Reproduced on Linux by failing daemon-reload during an update and on macOS by failing bootout: retry returns Changed=false with no mutating commands while the old configuration remains loaded. Preserve/recover pending application or restore the prior file on failure so retry actually applies the desired configuration; add failed-update/retry regression tests for both platforms.'
