      finding: internal/supervise/protocol.go:116 — Successful calls register a second context.AfterFunc but discard its stop function. Repeated Status/Input calls sharing a long-lived cancellable context retain callbacks and closed connections until that context ends. Return and invoke cancellation-hook cleanup when each simple call or stream finishes.
