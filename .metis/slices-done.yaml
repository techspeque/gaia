    - id: fix-0001
      title: 'The licences check fails in CI: go-licenses finds no licence for github.com/jmespath/go-jmespath'
      type: fix
      priority: p0
      risk: low
      coder: claude-code/opus-5-5
      reviewer: codex/gpt-6-astra
      plan: .metis/plans/phase-0-plan.md
      plan_section: 'Workstream 0.8: Release pipeline and install script'
      coded: true
      reviewed: true
      review_cycles: 0
      notes: 'CI job ''licenses'' on the Phase 0 pull request (ubuntu-latest) fails: make licenses -> go-licenses v2.0.1 check ./... prints "Did not find license for library ''github.com/jmespath/go-jmespath''" and exits 1 (Makefile:104). The module is reached through tailscale.com on linux; reproduce with GOOS=linux, since a macOS run may not load it. Establish the module''s real licence from its source at the pinned version, and make the check pass honestly: prefer a fix that keeps the module checked; if go-licenses cannot detect it, ignore that one module by name in the Makefile with a comment stating its licence and where it was read, and keep every other module checked. Do not widen ALLOWED_LICENSES, do not ignore by pattern, do not drop the CI job. Confirm the release SBOM and any licence notices shipped in the archives still cover the module. Run the check for every release GOOS/GOARCH that changes the dependency set, not only the host''s.'
      created: "2026-11-27"
    - id: fix-0002
      title: 'The release workflow cannot start: sigstore/cosign-installer@v4 does not exist'
      type: fix
      priority: p0
      risk: low
      coder: claude-code/opus-5-5
      reviewer: codex/gpt-6-astra
      plan: .metis/plans/phase-0-plan.md
      plan_section: 'Workstream 0.8: Release pipeline and install script'
      coded: true
      reviewed: true
      review_cycles: 0
      notes: 'First run of .github/workflows/release.yml on main (manual dispatch, the dry run) failed before any step: "Unable to resolve action sigstore/cosign-installer@v4, unable to find version v4". The action publishes no floating v4 tag; its tags are v2, v3 and full versions, the newest v4.1.4 (checked against the GitHub API on 2026-11-27). Every other uses: reference in release.yml and ci.yml was checked the same way and resolves (actions/checkout@v5, actions/setup-go@v6, actions/upload-artifact@v5, actions/download-artifact@v6, goreleaser/goreleaser-action@v6, anchore/sbom-action/download-syft@v0). Pin sigstore/cosign-installer to v4.1.4 and change nothing else in the workflow. The session cannot run GitHub workflows; say so in the report. The Human runs the dry run after this lands. If a cheap local check that action references use tags that exist is practical without network access in make verify, do not add one; note it as a follow-up instead.'
      created: "2026-11-27"
    - id: fix-0003
      title: 'On a machine already on the tailnet, Gaia''s devices get suffixed tailnet names, so README''s --host and node: steps fail'
      type: fix
      priority: p0
      risk: medium
      coder: claude-code/opus-5-5
      reviewer: codex/gpt-6-astra
      plan: .metis/plans/phase-0-plan.md
      plan_section: 'Workstream 0.7: Node role, registration and heartbeat'
      coded: true
      reviewed: true
      review_cycles: 1
      notes: |-
        Found by phase-0-gate run 1 (v0.0.1, see .metis/briefs/phase-0-gate.md, Findings). Both gate hosts already run the system Tailscale client under their machine name. gaia host asks the control server for the machine name and is given MACHINE-1; gaia node (default --name = machine name) is given MACHINE-1 too. Effects: (1) gaia node --host <host machine name>, as README shows, resolves to the machine's own Tailscale device, not Gaia's, and retries 'connection was refused' forever with no hint; (2) --allow node:<node's --name>, as README suggests, is refused 403 because the peer's tailnet name is the suffixed one, while the registry name stays unsuffixed: README's 'name in the registry and on the tailnet' is false here; (3) Gaia never prints the tailnet name it was given (host and node log only the address), so the names needed for --host and node: can only be found from another device or the admin console, and the host's allowlist can only be completed after the node has joined, with a host restart. ADR-0004 promises a stable name from --join. Required: the documented README steps for host and node work, unedited, on machines that already run Tailscale; each daemon reports the tailnet name it was given (log and/or a command); README states exactly which name --host and node: take. How (a --name for the host, a distinct default such as a gaia- prefix, a hint when --host resolves to a device with nothing on 443, matching node: on another field) is the Coder's design within ADR-0004; node: must stay bound to a control-server-asserted name, never to the self-claimed registry name. Then a release carrying the fix, and the gate re-runs from scenario 2.

        Decided by the Human on 2026-11-28, as the way to stop the collision: (a) the default tailnet name a Gaia daemon asks for is gaia-<machine name>, for host and node alike, so it does not collide with the machine's own Tailscale device; (b) gaia host gains --name, as gaia node has, and gaia service install passes it through; (c) the registry name and the tailnet name stay one name, and when the control server still assigns a different name (a suffix), the daemon logs the assigned name at start, reports it in gaia nodes, and node: allowlist entries match the assigned name. README, the fixtures and the launcher contract examples follow. Existing state directories joined under an old name keep working and keep their name; say in README how to re-join under the new one.
      created: "2026-11-27"
